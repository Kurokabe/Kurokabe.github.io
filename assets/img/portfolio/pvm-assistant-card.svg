    <rect x="250" y="160" width="46" height="160" rx="4"/>
    <rect x="314" y="110" width="46" height="50" rx="4"/>
    <rect x="378" y="110" width="46" height="80" rx="4" fill-opacity="0.55"/>
    <rect x="442" y="150" width="46" height="40" rx="4"/>
    <rect x="506" y="150" width="46" height="170" rx="4"/>
  </g>
  <line x1="238" y1="322" x2="564" y2="322" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="5 4" stroke-opacity="0.8">
    <line x1="296" y1="160" x2="314" y2="160"/>
    <line x1="360" y1="110" x2="378" y2="110"/>
    <line x1="424" y1="190" x2="442" y2="190"/>
