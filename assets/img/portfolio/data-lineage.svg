<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Flows: sources into the service, service out to consumers -->
  <g stroke="#c9b6e8" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M232 120 C277 120 277 195 322 195"/>
    <path d="M232 220 C277 220 277 215 322 215"/>
    <path d="M478 200 C523 200 523 160 568 160"/>
    <path d="M477 232 C523 232 523 280 568 280"/>
  </g>
  <!-- Unmapped source: dashed amber flow -->
  <path d="M236 320 C282 320 282 248 327 248" stroke="#f0a020" stroke-width="8" stroke-linecap="round"
    stroke-dasharray="16 14" fill="none"/>

  <!-- Mapped sources and consumers -->
  <g fill="#7b1fa2">
    <rect x="168" y="88" width="64" height="64" rx="14"/>
    <rect x="168" y="188" width="64" height="64" rx="14"/>
    <rect x="568" y="128" width="64" height="64" rx="14"/>
    <rect x="568" y="248" width="64" height="64" rx="14"/>
  </g>

  <!-- Digital service, protected by the compliance shield -->
  <path d="M400 136 L478 163 V222 C478 268 444 296 400 312 C356 296 322 268 322 222 V163 Z"
    fill="#ede7f6" stroke="#4a148c" stroke-width="7" stroke-linejoin="round"/>
  <rect x="367" y="183" width="66" height="66" rx="15" fill="#4a148c"/>

  <!-- Flagged source -->
  <rect x="172" y="292" width="56" height="56" rx="12" fill="#ffffff" stroke="#f0a020" stroke-width="8"/>
  <text x="200" y="334" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="38" font-weight="800" fill="#f0a020">!</text>

  <!-- Magnifier over the flagged source -->
  <circle cx="200" cy="320" r="52" fill="none" stroke="#311b4f" stroke-width="12"/>
  <line x1="238" y1="358" x2="278" y2="398" stroke="#311b4f" stroke-width="22" stroke-linecap="round"/>

  <text x="400" y="510" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="70" font-weight="700" fill="#311b4f" letter-spacing="-1">Data Lineage</text>
</svg>
